---
# tasks file for roles/bootstrap

- name: Provision bootstrap
  become: true
  block:
    - name: Create managment user
      ansible.builtin.user:
        name: "{{ bootstrap_user }}"
        shell: /bin/bash
        create_home: true

    - name: Upload SSH pulic key
      ansible.posix.authorized_key:
        user: "{{ bootstrap_user }}"
        state: present
        key: "{{ lookup('file', bootstrap_ssh_key_path) }}"

    - name: Ensure sudo package is installed (Debian only)
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian' and ansible_distribution != 'Ubuntu'

    - name: Configure sudo permissions
      ansible.builtin.template:
        src: sudoers.j2
        dest: "/etc/sudoers.d/{{ bootstrap_user }}"
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
