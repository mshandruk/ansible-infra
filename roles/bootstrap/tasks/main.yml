---
# tasks file for roles/bootstrap

- name: Provision bootstrap
  become: true
  block:
    - name: Create management user
      ansible.builtin.user:
        name: "{{ bootstrap_user }}"
        shell: /bin/bash
        create_home: true

    - name: Upload SSH public key
      ansible.posix.authorized_key:
        user: "{{ bootstrap_user }}"
        state: present
        key: "{{  item }}"
      loop: "{{ bootstrap_authorized_keys }}"

    - name: Ensure sudo is installed
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Configure sudo permissions
      ansible.builtin.template:
        src: sudoers.j2
        dest: "/etc/sudoers.d/{{ bootstrap_user }}"
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
