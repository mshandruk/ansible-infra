---
- name: Generate temporary firewall rules
  ansible.builtin.template:
    src: "{{ item.template_rules }}"
    dest: "{{ item.tmp_rules }}"
    mode: "0600"
  loop: "{{ gateway_iptables }}"
  register: gateway_rules_generated

- name: Validate temporary firewall rules
  ansible.builtin.command: "{{ item.restore_rules }} --test {{ item.tmp_rules }}"
  loop: "{{ gateway_iptables }}"
  changed_when: false
  when: gateway_rules_generated.changed
  tags:
    - skip_ansible_lint

- name: Create temporary backup of current working rules
  ansible.builtin.shell: "{{ item.save_rules }} > {{ item.backup_rules }}"
  loop: "{{ gateway_iptables }}"
  changed_when: false
  when: gateway_rules_generated.changed
  tags:
    - skip_ansible_lint

- name: Start emergency rollback timer in background
  ansible.builtin.shell: |
    (
      sleep 30
      {{ item.restore_rules }} < {{ item.backup_rules }}
      logger "Ansible Firewall: Connection lost! Rolled back to previous ruleset."
    ) & echo $! > {{ item.rollback_pid }}
  loop: "{{ gateway_iptables }}"
  changed_when: false
  when: gateway_rules_generated.changed
  tags:
    - skip_ansible_lint

- name: Apply new firewall rules right now
  ansible.builtin.shell: "{{ item.restore_rules }} < {{ item.tmp_rules }}"
  loop: "{{ gateway_iptables }}"
  changed_when: false
  when: gateway_rules_generated.changed
  tags:
    - skip_ansible_lint

- name: Connection check - Verify SSH is still working
  ansible.builtin.ping:

- name: Fix rules permanently if connection is safe
  ansible.builtin.command: netfilter-persistent save
  changed_when: false
  when: gateway_rules_generated.changed
  tags:
    - skip_ansible_lint

- name: Terminate rollback timer (We are safe)
  ansible.builtin.shell: |
    if [ -f {{ item.rollback_pid }} ]; then
      PID=$(cat {{ item.rollback_pid }})
      kill $PID 2>/dev/null
      rm -f {{ item.rollback_pid }}
    fi
  loop: "{{ gateway_iptables }}"
  changed_when: false
  when: gateway_rules_generated.changed
  tags:
    - skip_ansible_lint
