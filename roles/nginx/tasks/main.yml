---
# tasks file for roles/nginx

- name: Install nginx core
  become: true
  block:
    - name: Install nginx
      ansible.builtin.package:
        name: "nginx"
        state: present
        update_cache: true
      notify: Restart nginx

    - name: Install nginx additional packages
      ansible.builtin.package:
        name: "{{ nginx_additional_packages }}"
        state: present
        update_cache: true

    - name: Ensure nginx service is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
